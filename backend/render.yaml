services:
  - type: web
    name: hotel-api
    rootDir: backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/run_migrations.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRANSACTION_DATABASE_URL
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: PHONE_NUMBER
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production

  # Keeps Neon from suspending: hits /api/health/ready every 5 minutes
  # (hotel DB and transactions DB; the store sheet is checked when configured).
  - type: cron
    name: hotel-api-keepwarm
    rootDir: backend
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/keep_warm.py
    envVars:
      - key: HEALTH_PING_URL
        sync: false
      - key: HEALTH_PING_TIMEOUT_SEC
        value: "60"
